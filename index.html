<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - Team Task Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<nav class="navbar navbar-dark bg-primary">
    <div class="container-fluid">
        <span class="navbar-brand">TaskFlow</span>
    </div>
</nav>

<div class="container">
    <h4 class="mt-4">Team Tasks</h4>

    <div class="card mb-4">
        <div class="card-header">
            <strong>Create New Task</strong>
        </div>

        <div class="card-body">
            <div class="row g-2">
                <div class="col-md-3">
                    <input id="taskName" class="form-control" placeholder="Task name">
                </div>

                <div class="col-md-3">
                    <input id="taskDescription" class="form-control" placeholder="Description">
                </div>

                <div class="col-md-2">
                    <select id="assignedTo" class="form-select">
                        <option>Michael</option>
                        <option>Alex</option>
                        <option>Jordan</option>
                        <option>Taylor</option>
                        <option>Chris</option>
                    </select>
                </div>

                <div class="col-md-2">
                    <input id="dueDate" class="form-control" type="date">
                </div>

                <div class="col-md-2">
                    <button class="btn btn-primary w-100" onclick="addTask()">
                        Add Task
                    </button>
                </div>
            </div>
        </div>
    </div>

    <h6>Current Tasks</h6>
    <div id="taskList"></div>
</div>

<script src="script.js"></script>
</body>
</html>
